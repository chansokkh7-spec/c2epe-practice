<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games · K0</title>
<style>:root{--b:#0b1f4d;--g:#e8c766}*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(#cfeeff,#fff8e1);color:var(--b);padding:16px}
.w{max-width:860px;margin:auto}h1{margin:.2em 0}.tag{display:inline-block;background:var(--b);color:var(--g);padding:4px 14px;border-radius:99px;font-weight:700}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 4px 14px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}.fc{background:#fff8e1;border:3px solid var(--g);border-radius:18px;text-align:center;padding:12px;cursor:pointer}
.fc .e{font-size:54px}.fc b{display:block;font-size:18px}.fc:active{transform:scale(.96)}
button{font:inherit;font-weight:700;background:var(--b);color:var(--g);border:0;border-radius:14px;padding:10px 18px;cursor:pointer}
.o{display:inline-block;font-size:56px;margin:6px;padding:8px 14px;background:#fff8e1;border:3px solid #ddd;border-radius:16px;cursor:pointer}.o.ok{border-color:#2e9e4f;background:#e6f8ea}.o.no{border-color:#d33;background:#fde8e8}
.s{font-size:22px;line-height:1.6;padding:8px 12px;border-radius:10px;cursor:pointer}.s:hover{background:#e8c76655}video{width:100%;border-radius:16px;background:#000}
</style></head><body><div class="w"><span class="tag">K0 · Huge and Little</span><h1>Games · K0</h1><p>Play the picture games. Match, guess and win stars!</p>
<div class="card"><video controls preload="none" src="PR-games-k0.mp4"><track kind="captions" src="PR-games-k0.vtt" srclang="en" label="English"></video></div>
<div class="card"><h2>📚 Words</h2><div class="grid" id="g"></div></div>
<div class="card" id="act"></div>
<div class="card"><h2>🗣️ Say it</h2><p><b>It is huge / It is tiny</b></p><div class="s" onclick="say(this.textContent)">The whale is huge. The ant is tiny.</div><p>❓ <span class="s" onclick="say(this.textContent)">What is huge? What is tiny?</span></p></div>
<div class="card" id="st"></div></div>
<script>const D={"v": [["Huge", "🐘"], ["Little", "🐭"], ["Tall", "🦒"], ["Short", "🐧"], ["Long", "🐍"], ["Fat", "🐷"], ["Thin", "🐜"], ["Tiny", "🔹"]]};function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\w\s.,!?'-]/g,''));u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
const g=document.getElementById('g');D.v.forEach(w=>{const d=document.createElement('div');d.className='fc';d.innerHTML='<div class="e">'+w[1]+'</div><b>'+w[0]+'</b>🔊';d.onclick=()=>say(w[0]);g.appendChild(d)});
let sc=0,qn=0;const act=document.getElementById('act');
function mk(){const w=D.v[Math.floor(Math.random()*D.v.length)];const o=[w];while(o.length<3){const x=D.v[Math.floor(Math.random()*D.v.length)];if(!o.includes(x))o.push(x)}o.sort(()=>Math.random()-.5);
act.innerHTML='<h2>🎯 Picture game</h2><button id="pl">🔊 Listen</button> <span id="sc"></span><div id="op" style="margin-top:10px"></div>';
document.getElementById('pl').onclick=()=>say(w[0]);const op=document.getElementById('op');
o.forEach(x=>{const b=document.createElement('span');b.className='o';b.textContent=x[1];b.onclick=()=>{qn++;if(x===w){b.className='o ok';sc++;say('Great!')}else{b.className='o no';say(w[0])}document.getElementById('sc').textContent='⭐ '+sc+' / '+qn;setTimeout(mk,1100)};op.appendChild(b)});setTimeout(()=>say(w[0]),300)}
mk();
const st=document.getElementById('st');if(D.story){st.innerHTML='<h2>📖 Story</h2>'+D.story.map(s=>'<div class="s" onclick="say(this.textContent)">'+s+'</div>').join('')}else st.remove();
</script></body></html>
